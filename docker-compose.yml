services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app123
      POSTGRES_DB: layihe
      TZ: Asia/Baku
      PGTZ: Asia/Baku
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports: ["5678:5678"]
    environment:
      - GENERIC_TIMEZONE=Asia/Baku
      - TZ=Asia/Baku
    volumes: [n8ndata:/home/node/.n8n]
    depends_on: [postgres]

volumes:
  pgdata:
  n8ndata:
